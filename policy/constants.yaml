  - id: T-취득-06
    name: "오피스텔 취득세"
    layer: L1
    rule: >
      ⚠⚠ 유상승계취득이면 주거용·업무용을 가리지 않고 4.6% 고정
      (표준세율 4.0% + 지방교육세 0.4% + 농특세 0.2%).
      주택 세율(1~3%)과 다주택 중과가 걸리지 않는다 — 제8호는
      「「주택법」 제2조제1호의 주택**으로서** …대장·등기부에 주택으로 기재된」
      두 요건을 묶는데, 오피스텔은 **첫 요건부터** 탈락한다.
      주택법 제2조 제1호의 주택은 단독·공동주택으로 닫혀 있고 오피스텔은
      같은 조 제4호의 준주택이기 때문이다(주택법 시행령 제4조 4호).
      ⚠ 「고정」은 용도·주택 수에 대해서다 — **취득 원인은 별개**로,
      상속 2.8%(제1호 나목) · 무상취득 3.5%(제2호) · 원시취득 2.8%(제3호)다.
      ⚠ 제105조에 따라 **재산세를 주택분으로 과세하는** 오피스텔은 다른 주택
      취득 시 주택 수에 가산된다(제13조의3 4호). 기준은 「주거용인지」가 아니라
      「재산세가 주택으로 과세되는지」이고, 그 오피스텔 자체의 취득세와 혼동하지 않는다.
    basis: "지방세법 제11조 ① 7호 나목(제8호 반대해석) · 제13조의3 4호 · 제151조 ① 1호 · 주택법 제2조 1호·4호 · 동 시행령 제4조 4호 · 농특세법 제5조(⚠ 호 번호 미확인)"
    effective_from: null
    checked_at: 2026-08-16          # korean-law로 지방세법·주택법·동 시행령 원문 직접 확인
    expires_at: 2027-08-15
    status: 시행일확인
    value: null

