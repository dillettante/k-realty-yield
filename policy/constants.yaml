  - id: T-임대-05
    name: "월차임 전환율 상한 (주택)"
    layer: L2
    rule: >
      ⚠⚠ 두 상한 중 **낮은 비율**이다 — min(연 1할, 기준금리 + 2%p).
      「기준금리 + 2%p」만 쓰면 기준금리 8% 초과 구간에서 법정 상한을 넘긴 값을 낸다.
      ⭐ 법도 시행령도 안 고치고 금융통화위원회가 값을 움직인다.
    basis: "주택임대차보호법 제7조의2 제1호·제2호 · 시행령 제9조 제1항(연 1할)·제2항(2%) + 한국은행 기준금리"
