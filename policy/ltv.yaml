# ⚠⚠ 이 파일이 이 repo에서 가장 빨리 낡는다. 만료 30일.
# ⚠⚠ 이 파일의 값은 API로 받을 수 없다. 사람이 금융위 보도자료를 읽고 손으로 적는다.
#
# 규약: policy/schema.md · 갱신 절차: ../MAINTENANCE.md §2-1
#
# 왜 규정값과 실제값을 함께 적나 —
#   은행업감독규정 별표6 제2호 가목은 지금도 70%(규제지역 50%)이고,
#   실제 적용값은 행정지도로 정해진다. 별표6은 그 뒤 두 차례 개정되면서도
#   이 숫자를 손대지 않았다. 조문을 정확히 찾은 사람이 10%p 틀린 값을
#   확신과 함께 얻는다(『돈공부』 3.C.5).

